<!-- Rouge renders the markup at build time; highlight.js re-highlights it client-side (ignoreUnescapedHTML silences the resulting warning). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
<script>
  hljs.configure({ ignoreUnescapedHTML: true });
  hljs.highlightAll();
</script>
{% endif %}
