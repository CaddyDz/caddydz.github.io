<!-- Ported from the Glaz template. Nav hrefs are /#section so they work from post pages; each <a> keeps a class equal to its section id for the scroll-spy in js/app.js. -->
		<header
			class="absolute left-0 top-0 z-10 flex w-full items-center bg-transparent py-4 lg:py-6"
		>
			<div class="container">
				<div class="relative flex items-center justify-center">
					<!-- Top bar menu -->
					<div class="mx-auto flex items-center px-4 lg:px-0">
						<!-- Mobile nav button -->
						<button
							id="hamburger"
							name="hamburger"
							type="button"
							aria-label="Menu toggle"
							class="absolute right-4 block lg:hidden"
						>
							<span
								class="hamburger-line origin-top-left transition duration-300 ease-in-out"
							></span>
							<span
								class="hamburger-line transition duration-300 ease-in-out"
							></span>
							<span
								class="hamburger-line origin-bottom-left transition duration-300 ease-in-out"
							></span>
						</button>
						<!-- End mobile nav button -->
						<!-- Navigation Menu -->
						<nav
							id="nav-menu"
							class="absolute right-0 top-14 hidden w-full rounded border border-disable bg-body p-5 shadow-sm backdrop-blur-3xl lg:static lg:block lg:max-w-full lg:rounded-none lg:border-none lg:bg-transparent lg:p-0 lg:shadow-none lg:backdrop-blur-0"
							style="
								box-shadow: rgba(50, 50, 93, 0.25) 0px 50px 100px -20px,
									rgba(0, 0, 0, 0.3) 0px 30px 60px -30px;
							"
						>
							<ul class="flex flex-col gap-5 lg:flex-row lg:gap-8">
								<li class="group">
									<a
										href="/#about"
										class="about font-medium text-disable transition-colors group-hover:text-heading"
									>
										ABOUT
									</a>
								</li>
								<li class="group">
									<a
										href="/#resume"
										class="resume w-full font-medium text-disable group-hover:text-heading"
									>
										RESUME
									</a>
								</li>
								<li class="group">
									<a
										href="/#portfolio"
										class="portfolio w-full font-medium text-disable group-hover:text-heading"
									>
										PORTFOLIO
									</a>
								</li>
								<li class="group">
									<a
										href="/#blog"
										class="blog w-full font-medium text-disable group-hover:text-heading"
									>
										BLOG
									</a>
								</li>
								<li class="group">
									<a
										href="/#contact"
										class="contact w-full font-medium text-disable group-hover:text-heading"
									>
										CONTACT
									</a>
								</li>
							</ul>
						</nav>
						<!-- End navigation menu -->
					</div>
					<!-- End top bar menu -->
