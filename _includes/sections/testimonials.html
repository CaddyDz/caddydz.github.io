<!-- Testimonials Section Start -->
<section id="testimonials" class="pt-20 lg:pt-28">
  <div class="container">
    <div class="flex flex-col justify-start gap-8">
      <h2 class="heading text-center lg:text-left">What clients say</h2>
      <div class="grid grid-cols-1 gap-3 lg:grid-cols-2 lg:gap-6">
        {% for t in site.data.testimonials %}
        <figure class="bg-main flex flex-col justify-between gap-6 rounded p-7">
          <blockquote class="paragraph">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="mb-3 size-8 fill-current text-disable" aria-hidden="true">
              <path d="M4.583 17.321C3.553 16.227 3 15 3 13.011c0-3.5 2.457-6.637 6.03-8.188l.893 1.378c-3.335 1.804-3.987 4.145-4.247 5.621.537-.278 1.24-.375 1.929-.311 1.804.167 3.226 1.648 3.226 3.489a3.5 3.5 0 0 1-3.5 3.5c-1.073 0-2.099-.49-2.748-1.179zm10 0C13.553 16.227 13 15 13 13.011c0-3.5 2.457-6.637 6.03-8.188l.893 1.378c-3.335 1.804-3.987 4.145-4.247 5.621.537-.278 1.24-.375 1.929-.311 1.804.167 3.226 1.648 3.226 3.489a3.5 3.5 0 0 1-3.5 3.5c-1.073 0-2.099-.49-2.748-1.179z" />
            </svg>
            {{ t.quote }}
          </blockquote>
          <figcaption>
            <p class="font-darker text-2xl font-black leading-tight text-heading">{{ t.name }} <span class="text-base font-bold text-disable">({{ t.country }})</span></p>
            <p class="text-xs font-medium uppercase text-disable">{{ t.project }}</p>
          </figcaption>
        </figure>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
<!-- Testimonials Section End -->
