<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{% if page.layout == 'blog' %}{{ page.excerpt | strip_html | strip | escape }}{% else %}{{ site.data.profile.description }}{% endif %}" />
  <meta name="author" content="{{ site.data.profile.name }}" />
  {% if page.layout == "blog" %}
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="{{ site.title }}" />
  <meta property="og:title" content="{{ page.title }}" />
  <meta property="og:description" content="{{ page.excerpt | strip_html }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:image" content="{{ page.thumbnail | absolute_url }}" />
  <meta name="image" property="og:image" content="{{ page.thumbnail | absolute_url }}" />
  <meta name="publish_date" property="og:publish_date" content="{{ page.date }}" />
  <meta name="twitter:title" content="{{ page.title }}" />
  <meta name="twitter:description" content="{{ page.excerpt | strip_html }}" />
  <meta name="twitter:url" content="{{ page.url | absolute_url }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="{{ page.thumbnail | absolute_url }}" />
  <meta name="twitter:image:alt" content="{{ page.title }}" />
  <meta name="twitter:site" content="{{ site.data.profile.twitter_site }}" />
  {% endif %}
  <title>{{ page.title | default: site.title }}</title>
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@700;900&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <!-- Theme before first paint: sets html.dark / html.light / data-theme from localStorage or the OS. Must stay inline. -->
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      if (stored !== 'light' && stored !== 'dark') stored = 'system';
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = stored === 'dark' || (stored === 'system' && prefersDark);
      document.documentElement.dataset.theme = stored;
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.classList.toggle('light', stored === 'light');
    })();
  </script>
  <!-- Order matters: style.css (Tailwind typography resets `pre code`) must come BEFORE the highlight.js theme, or code blocks lose their colours. -->
  <link rel="stylesheet" href="/css/style.css" />
  {% if page.layout == "blog" %}
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/base16/material-palenight.min.css"
  />
  {% endif %}
</head>
