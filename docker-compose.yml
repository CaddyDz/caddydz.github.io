services:
  # Tailwind watcher: writes css/style.css on the host through the bind mount.
  # Uses the host node_modules (pure-JS deps), installing them if missing.
  tailwind:
    image: node:22-alpine
    working_dir: /srv
    volumes:
      - .:/srv
    command: sh -c "[ -x node_modules/.bin/tailwindcss ] || npm ci --no-audit --no-fund; npx tailwindcss -i input.css -o css/style.css --watch --poll"

  web:
    build: .
    image: caddydz/caddydz.github.io
    restart: unless-stopped
    depends_on:
      - tailwind
    volumes:
      - .:/srv
    ports:
      - "35729:35729"
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.dsalim.rule=Host(`dsalim.localhost`)
      - traefik.http.routers.dsalim.entrypoints=web
      - traefik.http.routers.dsalim.service=dsalim
      - traefik.http.services.dsalim.loadbalancer.server.port=4000

networks:
  traefik:
    external: true
